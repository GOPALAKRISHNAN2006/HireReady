services:
  # Single Node.js Web Service (serves both API + SPA frontend)
  # The Express server handles SPA routing via its catch-all handler,
  # so page refreshes and direct navigation always work.
  - type: web
    name: hireready
    runtime: node
    rootDir: .
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm install
    startCommand: node server/server.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
